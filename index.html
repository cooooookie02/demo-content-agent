<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>内容即入口 · AI决策Agent Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, 'PingFang SC', sans-serif; }

  .phone {
    width: 390px;
    height: 844px;
    background: #fff;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 40px 80px rgba(0,0,0,0.3);
  }

  /* STATUS BAR */
  .status-bar {
    height: 44px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    font-size: 12px;
    font-weight: 600;
    position: relative;
    z-index: 100;
  }
  .status-bar .notch {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 34px;
    background: #000;
    border-radius: 0 0 20px 20px;
  }

  /* SCREENS */
  .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* ===== FEED SCREEN ===== */
  #feed-screen { background: #fff; }

  .top-nav {
    height: 88px;
    padding-top: 44px;
    background: #fff;
    display: flex;
    align-items: center;
    padding-left: 16px;
    padding-right: 16px;
    gap: 12px;
    border-bottom: 1px solid #f5f5f5;
    flex-shrink: 0;
  }
  .nav-tabs { display: flex; gap: 16px; flex: 1; }
  .nav-tab {
    font-size: 15px;
    color: #999;
    cursor: pointer;
    padding-bottom: 2px;
    transition: all 0.2s;
  }
  .nav-tab.active {
    color: #111;
    font-weight: 700;
    border-bottom: 2px solid #FF2442;
  }
  .search-box {
    flex: 2;
    background: #f5f5f5;
    border-radius: 20px;
    height: 32px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 6px;
    font-size: 13px;
    color: #999;
  }

  /* SCENE SWITCHER */
  .scene-tabs {
    display: flex;
    padding: 10px 16px 0;
    gap: 8px;
    flex-shrink: 0;
  }
  .scene-tab {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    border: 1.5px solid #eee;
    color: #666;
    transition: all 0.2s;
    background: #fff;
  }
  .scene-tab.active {
    background: #FF2442;
    color: #fff;
    border-color: #FF2442;
    font-weight: 600;
  }

  /* PROGRESS BAR */
  .intent-bar {
    margin: 8px 16px;
    flex-shrink: 0;
  }
  .intent-bar-label {
    font-size: 11px;
    color: #999;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }
  .intent-bar-label span { color: #FF2442; font-weight: 600; }
  .intent-bar-track {
    height: 4px;
    background: #f0f0f0;
    border-radius: 4px;
    overflow: hidden;
  }
  .intent-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #FF2442, #ff6b81);
    border-radius: 4px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  /* WATERFALL */
  .feed-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    -webkit-overflow-scrolling: touch;
  }
  .feed-scroll::-webkit-scrollbar { display: none; }
  .waterfall {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .card {
    border-radius: 12px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    animation: cardIn 0.3s ease forwards;
    opacity: 0;
  }
  .card:active { transform: scale(0.97); }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-img {
    width: 100%;
    aspect-ratio: 3/4;
    position: relative;
    overflow: hidden;
  }
  .card-img-inner {
    width: 100%; height: 100%;
    display: flex; align-items: flex-end;
    padding: 8px;
  }
  .card-tag {
    background: rgba(0,0,0,0.45);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
  }
  .card-body { padding: 8px; }
  .card-title { font-size: 13px; color: #111; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .card-avatar { width: 20px; height: 20px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }
  .card-user { font-size: 11px; color: #999; display: flex; align-items: center; flex: 1; overflow: hidden; }
  .card-user-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-likes { font-size: 11px; color: #999; display: flex; align-items: center; gap: 3px; }

  /* BUBBLE */
  .ai-bubble {
    position: absolute;
    bottom: 100px;
    right: 16px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    z-index: 200;
    opacity: 0;
    transform: translateY(20px) scale(0.9);
    pointer-events: none;
    transition: all 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .ai-bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .ai-bubble-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b2b, #ffb347);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(255,36,66,0.4);
    animation: bubblePulse 2s infinite;
  }
  @keyframes bubblePulse {
    0%, 100% { box-shadow: 0 4px 12px rgba(255,36,66,0.4); }
    50% { box-shadow: 0 4px 20px rgba(255,36,66,0.7); }
  }
  .ai-bubble-text {
    background: #fff;
    border-radius: 18px 18px 4px 18px;
    padding: 10px 14px;
    font-size: 13px;
    color: #111;
    max-width: 200px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    line-height: 1.5;
    cursor: pointer;
  }
  .ai-bubble-text strong { color: #FF2442; }
  .ai-bubble-cta {
    display: block;
    margin-top: 6px;
    background: #FF2442;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    text-align: center;
  }

  /* BOTTOM NAV */
  .bottom-nav {
    height: 83px;
    background: #fff;
    border-top: 1px solid #f0f0f0;
    display: flex;
    align-items: flex-start;
    padding-top: 10px;
    flex-shrink: 0;
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
  }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
  .nav-item .icon { font-size: 22px; }
  .nav-item .label { font-size: 10px; color: #999; }
  .nav-item.active .label { color: #FF2442; }
  .nav-publish {
    width: 44px; height: 28px;
    background: linear-gradient(135deg, #FF2442, #ff6b81);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(255,36,66,0.4);
  }
  .nav-publish span { font-size: 20px; color: #fff; line-height: 1; }

  /* ===== CHAT SCREEN ===== */
  #chat-screen { background: #f5f5f5; }

  .chat-header {
    height: 88px;
    padding-top: 44px;
    background: #fff;
    display: flex;
    align-items: center;
    padding-left: 16px;
    padding-right: 16px;
    gap: 12px;
    border-bottom: 1px solid #f0f0f0;
    flex-shrink: 0;
  }
  .chat-back { font-size: 22px; cursor: pointer; color: #111; }
  .chat-agent-info { flex: 1; }
  .chat-agent-name { font-size: 15px; font-weight: 600; color: #111; }
  .chat-agent-status { font-size: 12px; color: #52c41a; }
  .chat-agent-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff6b2b, #ffb347);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    padding-bottom: 100px;
    -webkit-overflow-scrolling: touch;
  }
  .chat-messages::-webkit-scrollbar { display: none; }

  .msg { display: flex; gap: 8px; margin-bottom: 16px; animation: msgIn 0.3s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .msg-avatar.ai { background: linear-gradient(135deg, #ff6b2b, #ffb347); }
  .msg-avatar.user-av { background: linear-gradient(135deg, #667eea, #764ba2); }
  .msg-bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
    color: #111;
  }
  .msg.ai .msg-bubble { background: #fff; border-radius: 4px 18px 18px 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .msg.user .msg-bubble { background: #FF2442; color: #fff; border-radius: 18px 4px 18px 18px; }

  /* CHOICE BUTTONS */
  .choice-row { display: flex; flex-wrap: wrap; gap: 8px; margin: -8px 0 8px 40px; }
  .choice-btn {
    padding: 7px 14px;
    border: 1.5px solid #FF2442;
    border-radius: 20px;
    font-size: 13px;
    color: #FF2442;
    background: #fff;
    cursor: pointer;
    transition: all 0.15s;
  }
  .choice-btn:active, .choice-btn.selected { background: #FF2442; color: #fff; }

  /* RESULT CARD */
  .result-card {
    background: #fff;
    border-radius: 16px;
    padding: 14px;
    margin: -8px 0 8px 40px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .result-card-title {
    font-size: 13px;
    font-weight: 700;
    color: #111;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #f5f5f5;
    font-size: 13px;
  }
  .result-row:last-child { border-bottom: none; padding-bottom: 0; }
  .result-row-label { color: #666; }
  .result-row-value { color: #111; font-weight: 600; }
  .result-row-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .tag-rush { background: #fff1f0; color: #FF2442; }
  .tag-stable { background: #f6ffed; color: #52c41a; }
  .tag-safe { background: #fffbe6; color: #fa8c16; }

  .book-btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    padding: 12px;
    background: linear-gradient(135deg, #FF2442, #ff6b81);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 12px rgba(255,36,66,0.35);
    transition: opacity 0.15s;
  }
  .book-btn:active { opacity: 0.85; }

  /* MERCHANT CARDS */
  .merchant-list { margin: -8px 0 8px 0; display: flex; flex-direction: column; gap: 10px; }
  .merchant-card {
    background: #fff;
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
    animation: cardIn 0.3s ease forwards;
    opacity: 0;
  }
  .merchant-card:nth-child(1) { animation-delay: 0.05s; }
  .merchant-card:nth-child(2) { animation-delay: 0.15s; }
  .merchant-card:nth-child(3) { animation-delay: 0.25s; }
  .merchant-card:active { border-color: #FF2442; transform: scale(0.98); }
  .merchant-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .merchant-avatar {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .merchant-info { flex: 1; }
  .merchant-name { font-size: 14px; font-weight: 700; color: #111; }
  .merchant-sub { font-size: 11px; color: #999; margin-top: 2px; }
  .merchant-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .badge-top { background: #fff1f0; color: #FF2442; }
  .badge-good { background: #f6ffed; color: #52c41a; }
  .badge-value { background: #fffbe6; color: #fa8c16; }
  .merchant-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .merchant-tag {
    font-size: 11px;
    background: #f5f5f5;
    color: #555;
    padding: 3px 8px;
    border-radius: 8px;
  }
  .merchant-highlight {
    background: linear-gradient(135deg, #fff1f3, #fff8f9);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    color: #FF2442;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
  }
  .merchant-footer { display: flex; align-items: center; justify-content: space-between; }
  .merchant-stats { font-size: 11px; color: #999; display: flex; gap: 10px; }
  .merchant-cta {
    padding: 7px 16px;
    background: #FF2442;
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  /* TYPING INDICATOR */
  .typing { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
  .typing span {
    width: 7px; height: 7px;
    background: #ccc;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); background: #FF2442; } }

  .chat-input-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-top: 1px solid #f0f0f0;
    padding: 10px 16px 30px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 50;
  }
  .chat-input {
    flex: 1;
    background: #f5f5f5;
    border: none;
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .chat-send {
    width: 36px; height: 36px;
    background: #FF2442;
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .upload-btn {
    width: 36px; height: 36px;
    background: #f5f5f5;
    border: none;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  /* MERCHANT DM SCREEN */
  #dm-screen { background: #f5f5f5; }
  .dm-header {
    height: 88px;
    padding-top: 44px;
    background: #fff;
    display: flex;
    align-items: center;
    padding: 0 16px;
    padding-top: 44px;
    gap: 12px;
    border-bottom: 1px solid #f0f0f0;
    flex-shrink: 0;
  }
  .dm-back { font-size: 22px; cursor: pointer; color: #111; }
  .dm-merchant-avatar {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .dm-merchant-info { flex: 1; }
  .dm-merchant-name { font-size: 15px; font-weight: 700; color: #111; }
  .dm-merchant-status { font-size: 11px; color: #52c41a; }
  .dm-more { font-size: 22px; color: #999; cursor: pointer; }

  .dm-notice {
    margin: 12px 16px;
    background: #fffbe6;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 11px;
    color: #8a6d00;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .dm-messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px;
    padding-bottom: 90px;
    -webkit-overflow-scrolling: touch;
  }
  .dm-messages::-webkit-scrollbar { display: none; }

  .dm-input-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-top: 1px solid #f0f0f0;
    padding: 10px 16px 30px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 50;
  }
  .dm-input {
    flex: 1;
    background: #f5f5f5;
    border: none;
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .dm-send {
    width: 36px; height: 36px;
    background: #FF2442;
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .dm-tools { display: flex; gap: 8px; }
  .dm-tool-btn {
    width: 32px; height: 32px;
    background: #f5f5f5;
    border: none;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* quick replies */
  .quick-replies {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 0 10px 0;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
  }
  .quick-replies::-webkit-scrollbar { display: none; }
  .quick-reply {
    white-space: nowrap;
    padding: 6px 14px;
    border: 1.5px solid #FF2442;
    border-radius: 20px;
    font-size: 12px;
    color: #FF2442;
    background: #fff;
    cursor: pointer;
    flex-shrink: 0;
  }
  .quick-reply:active { background: #FF2442; color: #fff; }

  /* BOOKING MODAL */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 300;
    display: none;
    align-items: flex-end;
  }
  .modal-overlay.show { display: flex; }
  .modal-sheet {
    width: 100%;
    background: #f5f5f5;
    border-radius: 24px 24px 0 0;
    padding: 20px 20px 40px;
    animation: sheetUp 0.35s cubic-bezier(.4,0,.2,1);
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-sheet::-webkit-scrollbar { display: none; }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-size: 17px; font-weight: 700; text-align: center; margin-bottom: 4px; }
  .modal-sub { font-size: 12px; color: #999; text-align: center; margin-bottom: 16px; }

  .booking-section { margin-bottom: 16px; }
  .booking-section-title {
    font-size: 13px; font-weight: 700; color: #333;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }

  /* 门店选择 */
  .store-list { display: flex; flex-direction: column; gap: 8px; }
  .store-item {
    background: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 10px;
  }
  .store-item.selected { border-color: #FF2442; background: #fff8f9; }
  .store-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid #ddd;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .store-item.selected .store-dot { border-color: #FF2442; background: #FF2442; }
  .store-item.selected .store-dot::after { content: ''; width: 6px; height: 6px; background: #fff; border-radius: 50%; display: block; }
  .store-info { flex: 1; }
  .store-name { font-size: 14px; font-weight: 600; color: #111; }
  .store-addr { font-size: 11px; color: #999; margin-top: 2px; }
  .store-tag { font-size: 11px; color: #FF2442; background: #fff1f0; padding: 2px 8px; border-radius: 8px; flex-shrink: 0; }

  /* 时间选择 */
  .date-tabs { display: flex; gap: 8px; margin-bottom: 10px; }

let currentChoice1 = null;

function openChat() {
  const s = SCENES[currentScene];
  document.getElementById('agent-name').textContent = s.agentName;
  document.getElementById('agent-avatar').textContent = s.agentEmoji;
  document.getElementById('chat-messages').innerHTML = '';
  chatFlow = FLOWS[s.flow];
  chatStep = 0;
  currentChoice1 = null;

  document.getElementById('feed-screen').classList.remove('active');
  document.getElementById('chat-screen').classList.add('active');

  // send intro messages with delay
  chatFlow.intro.forEach((msg, i) => {
    setTimeout(() => addAIMsg(msg), i * 800 + 300);
  });
  setTimeout(() => {
    addChoices(chatFlow.choices1, 1);
  }, chatFlow.intro.length * 800 + 600);
}

function addAIMsg(text, typing = true) {
  const msgs = document.getElementById('chat-messages');
  if (typing) {
    const typingEl = document.createElement('div');
    typingEl.className = 'msg ai';
    typingEl.id = 'typing-indicator';
    typingEl.innerHTML = `<div class="msg-avatar ai">${SCENES[currentScene].agentEmoji}</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    msgs.appendChild(typingEl);
    msgs.scrollTop = msgs.scrollHeight;
    setTimeout(() => {
      const old = document.getElementById('typing-indicator');
      if (old) old.remove();
      appendAIBubble(text);
    }, 900);
  } else {
    appendAIBubble(text);
  }
}

function appendAIBubble(text) {
  const msgs = document.getElementById('chat-messages');
  const el = document.createElement('div');
  el.className = 'msg ai';
  el.innerHTML = `<div class="msg-avatar ai">${SCENES[currentScene].agentEmoji}</div><div class="msg-bubble">${text.replace(/\n/g,'<br>')}</div>`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}

function addUserMsg(text) {
  const msgs = document.getElementById('chat-messages');
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `<div class="msg-bubble">${text}</div><div class="msg-avatar user-av">😊</div>`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}

function addChoices(choices, step) {
  const msgs = document.getElementById('chat-messages');
  const row = document.createElement('div');
  row.className = 'choice-row';
  row.id = 'choices-' + step;
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = () => onChoice(c, step, row);
    row.appendChild(btn);
  });
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function onChoice(c, step, row) {
  row.querySelectorAll('.choice-btn').forEach(b => { b.disabled = true; b.style.opacity = 0.5; });
  addUserMsg(c);

  if (step === 1) {
    currentChoice1 = c;
    const reply = chatFlow.afterChoice1(c);
    setTimeout(() => addAIMsg(reply), 400);
    setTimeout(() => addChoices(chatFlow.choices2, 2), 1800);
  } else if (step === 2) {
    setTimeout(() => addAIMsg(chatFlow.afterChoice2), 400);
    setTimeout(() => {
      if (chatFlow.showCard) {
        const card = chatFlow.getCard(currentChoice1);
        addResultCard(card);
      }
    }, 1600);
    setTimeout(() => addAIMsg(chatFlow.afterCard), 2800);
    setTimeout(() => addBookBtn(), 3800);
  }
}

function addResultCard(card) {
  const msgs = document.getElementById('chat-messages');
  let rowsHtml = card.rows.map(r => `
    <div class="result-row">
      <span class="result-row-label">${r.label}</span>
      ${r.tag ? `<span class="result-row-tag ${r.tag}">${r.tagText}</span><span class="result-row-value" style="margin-left:6px">${r.value}</span>` : `<span class="result-row-value">${r.value}</span>`}
    </div>`).join('');
  const el = document.createElement('div');
  el.className = 'result-card';
  el.innerHTML = `<div class="result-card-title">${card.title}</div>${rowsHtml}`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}

  // 替换为商家对比卡片
  addMerchantCards();
}

  let reply = '';

  if (text.includes('选校') || text.includes('方案') || text.includes('院校') || text.includes('offer')) {
    reply = '好的！根据你的背景（211，GPA 3.4），我初步整理了一份选校思路：<br><br>🎯 冲刺：UCL / 爱丁堡<br>✅ 主申：曼大 / 谢菲尔德<br>🛡 保底：利兹 / 伯明翰<br><br>文书方向建议围绕「跨学科背景 + 实习经历」来写，竞争力会更强。';
  } else if (text.includes('文书') || text.includes('PS') || text.includes('personal')) {
    reply = '文书是留学申请里拉开差距的关键！建议你的PS结构分三段：学术动机 → 实践经历 → 未来规划，每段都要有具体细节，不能写成流水账。<br><br>我们有专属文书导师，可以1对1帮你打磨。';
  } else if (text.includes('费用') || text.includes('价格') || text.includes('多少钱') || text.includes('收费')) {
    reply = '我们的服务费用根据套餐不同有差异：<br><br>· 基础选校+文书套餐：1.8万起<br>· 全程陪跑套餐：3.5万起<br>· 保录取签约：另议<br><br>相比行业均价低20-30%，且全程透明不加价。';
  } else if (text.includes('案例') || text.includes('成功') || text.includes('样板') || text.includes('作品')) {
    reply = '当然！给你看几个近期案例 📸<br><br>🖼 北欧原木风 · 95㎡ · 落地预算22万<br>🖼 轻奢简约 · 110㎡ · 落地预算31万<br>🖼 新中式 · 88㎡ · 落地预算19万<br><br>每个案例都有完整施工记录，想看哪个风格的细节？';
  } else if (text.includes('导师') || text.includes('医生') || text.includes('设计师') || text.includes('谁')) {
    reply = '我们的顾问都是行业10年以上的专家，资质可以在平台主页查到。你这边情况比较适合安排王老师，她专注英国方向8年，手上有很多类似背景的成功案例。';
  } else {
    reply = '收到！这个问题我来详细解答。' + (currentScene === 'study' ? '留学申请涉及的环节比较多，选校、文书、语言、背调缺一不可，建议系统规划。' : currentScene === 'deco' ? '装修最重要的是前期规划好，避免后期改动造成浪费，我们有完整的装前顾问服务。' : '医美项目的选择和机构资质都很重要，建议先面诊再决定，不要只看价格。');
  }

  // 第一轮对话结束后，商家主动引导预约
  if (dmRoundCount === 1) {
    setTimeout(() => {
      const dmMsgs = document.getElementById('dm-messages');
      // 商家追问
      const followEl = document.createElement('div');
      followEl.className = 'msg ai';
      followEl.innerHTML = `<div class="msg-avatar ai" style="background:${currentMerchant.color}; border-radius:10px;">${currentMerchant.emoji}</div><div class="msg-bubble" style="background:#fff;">${scene.reply}</div>`;
      dmMsgs.appendChild(followEl);

      // 预约按钮
      const bookEl = document.createElement('div');
      bookEl.style.cssText = 'margin: 4px 0 8px 40px;';
      bookEl.innerHTML = `<button class="book-btn" style="max-width:260px" onclick="openBooking()">📅 ${scene.label}</button>`;
      dmMsgs.appendChild(bookEl);
      dmMsgs.scrollTop = dmMsgs.scrollHeight;
    }, 1500);
  }

  return reply;
}

function backToChat() {
  document.getElementById('dm-screen').classList.remove('active');
  document.getElementById('chat-screen').classList.add('active');
}

function handleUpload() {
  addUserMsg('📎 [已上传相关材料]');
  setTimeout(() => addAIMsg('收到你的材料了！我来帮你分析一下 🔍'), 600);
}

function sendUserMsg() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addUserMsg(text);
  setTimeout(() => addAIMsg('收到！我来根据你的情况进一步分析…'), 600);
}

  ]
};

const DATES = [
  { day: '31', label: '明天', week: '周二' },
  { day: '01', label: '后天', week: '周三' },
  { day: '02', label: '4月2日', week: '周四' },
];

const TIMES = ['09:00','10:00','11:00','14:00','15:00','16:00','17:00','18:00'];
const FULL_SLOTS = ['09:00','11:00','17:00']; // 模拟已约满

let selectedStore = null;
let selectedDate = null;
let selectedTime = null;

function openBooking() {
  selectedStore = null; selectedDate = null; selectedTime = null;
  const stores = STORES[currentScene] || STORES.beauty;

  // 渲染门店
  const storeList = document.getElementById('store-list');
  storeList.innerHTML = '';
  stores.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'store-item';
    el.innerHTML = `<div class="store-dot"></div>
      <div class="store-info">
        <div class="store-name">${s.name}</div>
        <div class="store-addr">📍 ${s.addr}</div>
      </div>
      <span class="store-tag">${s.tag}</span>`;
    el.onclick = () => {
      document.querySelectorAll('.store-item').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      selectedStore = s;
    };
    storeList.appendChild(el);
  });

  // 渲染日期
  const dateTabs = document.getElementById('date-tabs');
  dateTabs.innerHTML = '';
  DATES.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'date-tab';
    el.innerHTML = `<div class="dt-day">${d.day}</div><div class="dt-label">${d.label} ${d.week}</div>`;
    el.onclick = () => {
      document.querySelectorAll('.date-tab').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      selectedDate = d;
    };
    dateTabs.appendChild(el);
  });

  // 渲染时间
  const timeGrid = document.getElementById('time-grid');
  timeGrid.innerHTML = '';
  TIMES.forEach(t => {
    const isFull = FULL_SLOTS.includes(t);
    const el = document.createElement('div');
    el.className = 'time-chip' + (isFull ? ' full' : '');
    el.textContent = isFull ? t + ' 满' : t;
    if (!isFull) {
      el.onclick = () => {
        document.querySelectorAll('.time-chip').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        selectedTime = t;
      };
    }
    timeGrid.appendChild(el);
  });

  document.getElementById('booking-modal').classList.add('show');
}

function closeModal(e) {
  if (e.target === document.getElementById('booking-modal')) {
    document.getElementById('booking-modal').classList.remove('show');
  }
}

function confirmBooking() {
  // 默认兜底选第一个
  if (!selectedStore) { document.querySelector('.store-item').click(); }
  if (!selectedDate) { document.querySelector('.date-tab').click(); }
  if (!selectedTime) { document.querySelector('.time-chip:not(.full)').click(); }

  document.getElementById('booking-modal').classList.remove('show');
  showSuccess();
}

function showSuccess() {
  const store = selectedStore || STORES[currentScene][0];
  const date = selectedDate || DATES[0];
  const time = selectedTime || '10:00';

  const agentMap = { study: '王老师·英国申请专家', deco: '陈设计师·10年经验', beauty: '张医生·整形外科副主任' };
  const noteMap = { study: '留学规划 · 60分钟', deco: '免费量房 + 初步方案', beauty: '免费面诊 · 30分钟' };

  document.getElementById('success-card').innerHTML = `
    <div class="sc-label">顾问</div>
    <div class="sc-value">${agentMap[currentScene]}</div>
    <div class="sc-divider"></div>
    <div class="sc-label">门店</div>
    <div class="sc-value" style="font-size:14px">${store.name}</div>
    <div class="sc-divider"></div>
    <div class="sc-label">预约时间</div>
    <div class="sc-value">${date.label}（${date.week}）${time}</div>
    <div class="sc-divider"></div>
    <div class="sc-label">服务内容</div>
    <div class="sc-value">${noteMap[currentScene]}</div>
  `;
  document.getElementById('success-screen').classList.add('show');
}

function backToFeed() {
  document.getElementById('chat-screen').classList.remove('active');
  document.getElementById('success-screen').classList.remove('show');
  document.getElementById('feed-screen').classList.add('active');
  browseCount = 0;
  bubbleShown = false;
  document.getElementById('intent-fill').style.width = '0%';
  document.getElementById('browse-count').textContent = '已浏览 0 篇';
  document.getElementById('ai-bubble').classList.remove('show');
}

renderFeed(currentScene);
